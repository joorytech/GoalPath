<body class="min-h-screen flex items-center justify-center p-margin-mobile">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_10px_32px_rgba(15,23,42,0.12)] p-lg">
<!-- Header Image -->
<div class="flex justify-center mb-lg">
<img alt="GoalPath Logo" class="h-20 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAPHgNStjd3usJC5CiuW3wKv9sT5aORmitvsNXyR7fMPOCyr8ePuN8xZN-yI4AGviofKvC3vq1IXfUGSKL8oPy8JUbtxFySH7owTyFZZEubD3Mib5l1J1F9t5_CTZ1ggl6pyOzoZ4dc-bL1iR33--DMJLM2hMo6ztnAufu39dLND8UVFXb-Px7iLJuK0pAX1D4iZ1HGVlhK-5M6_yApoWb_BHLfFYJkF1vgMRb9FrDT_6XM7TWHNnsf"/>
</div>
<div class="text-center mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-base">إنشاء حساب</h1>
<p class="font-body-md text-body-md text-on-surface-variant">ابدأ رحلتك نحو تحقيق أهدافك</p>
</div>
<form class="space-y-md">
<!-- Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="name">الاسم</label>
<div class="relative">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-outline">
<span class="material-symbols-outlined">person</span>
</span>
<input class="w-full pl-3 pr-10 py-sm rounded-lg border border-surface-lavender-deep bg-surface-container-lowest text-on-surface focus:outline-none input-glow transition-all duration-200" id="name" name="name" placeholder="أدخل اسمك الكامل" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">البريد الإلكتروني</label>
<div class="relative">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-outline">
<span class="material-symbols-outlined">mail</span>
</span>
<input class="w-full pl-3 pr-10 py-sm rounded-lg border border-surface-lavender-deep bg-surface-container-lowest text-on-surface focus:outline-none input-glow transition-all duration-200" dir="ltr" id="email" name="email" placeholder="example@domain.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">كلمة المرور</label>
<div class="relative">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-outline">
<span class="material-symbols-outlined">lock</span>
</span>
<input class="w-full pl-3 pr-10 py-sm rounded-lg border border-surface-lavender-deep bg-surface-container-lowest text-on-surface focus:outline-none input-glow transition-all duration-200" dir="ltr" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="confirm-password">تأكيد كلمة المرور</label>
<div class="relative">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-outline">
<span class="material-symbols-outlined">lock_reset</span>
</span>
<input class="w-full pl-3 pr-10 py-sm rounded-lg border border-surface-lavender-deep bg-surface-container-lowest text-on-surface focus:outline-none input-glow transition-all duration-200" dir="ltr" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-action-purple-primary hover:bg-action-purple-dark text-on-primary font-title-md text-title-md py-sm rounded-lg hover:-translate-y-0.5 hover:shadow-md active:scale-95 transition-all duration-200 flex justify-center items-center gap-2 mt-lg" type="submit">
                إنشاء حساب
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                لدي حساب بالفعل؟ 
                <a class="text-action-purple-primary hover:text-action-purple-dark font-bold hover:underline" href="#">تسجيل الدخول</a>
</p>
</div>
</div>
