<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md min-h-screen pb-24 md:pb-0" style="background-color: rgb(255, 255, 255);">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim flat no shadows flex items-center justify-between px-margin-mobile h-16 w-full">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 transition-transform p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">GoalPath</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="pt-20 px-margin-mobile max-w-2xl mx-auto">
<!-- Progress Indicator -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-label-md text-on-surface-variant">الخطوة 1 من 2</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden flex flex-row-reverse">
<div class="h-full bg-primary w-1/2 rounded-full"></div>
</div>
</div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-6">ما هدفك؟</h1>
<!-- Form Content -->
<div class="space-y-6">
<!-- Goal Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="goal-name">اسم الهدف</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="goal-name" placeholder="أدخل اسم الهدف هنا..." type="text">
</div>
<!-- Goal Description -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="goal-description">وصف الهدف</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all resize-none" id="goal-description" placeholder="تفاصيل إضافية حول هدفك..." rows="3"></textarea>
</div>
<!-- Category Chips -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2">التصنيف</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-primary text-primary font-label-md text-label-md bg-primary/10 hover:bg-primary/20 transition-colors">تعليمي</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors">مهني</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors">شخصي</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors">مشروع</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors">أخرى</button>
</div>
</div>
<!-- Dates -->
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="start-date">تاريخ البداية</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all appearance-none" id="start-date" type="date">
<span class="material-symbols-outlined absolute left-3 top-3.5 text-on-surface-variant pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="end-date">الموعد المتوقع</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all appearance-none" id="end-date" type="date">
<span class="material-symbols-outlined absolute left-3 top-3.5 text-on-surface-variant pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
</div>
<!-- Priority -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2">الأولوية</label>
<div class="flex gap-2">
<button class="flex-1 py-3 rounded-lg border border-outline-variant text-on-surface-variant font-label-md text-label-md flex flex-col items-center justify-center gap-1 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-outline" data-icon="stat_minus_1">stat_minus_1</span>
                        منخفض
                    </button>
<button class="flex-1 py-3 rounded-lg border-2 border-primary bg-primary/5 text-primary font-label-md text-label-md flex flex-col items-center justify-center gap-1 transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="horizontal_rule">horizontal_rule</span>
                        متوسط
                    </button>
<button class="flex-1 py-3 rounded-lg border border-outline-variant text-on-surface-variant font-label-md text-label-md flex flex-col items-center justify-center gap-1 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-error" data-icon="stat_1">stat_1</span>
                        مرتفع
                    </button>
</div>
</div>
</div>
<!-- Primary Action Button -->
<div class="mt-8 mb-8">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-title-md text-title-md flex items-center justify-center gap-2 hover:bg-action-purple-dark active:scale-95 transition-all shadow-[0px_4px_20px_rgba(15,23,42,0.05)]">
                التالي
                <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
</main>


</body></html>
